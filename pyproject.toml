[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slipsurface3d"
version = "0.1.0"
description = "Three-dimensional limit-equilibrium slope stability analysis (Method of Columns + PyVista/Qt)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Hasan Deniz Altuntaş"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyvista>=0.49.2",
    "PySide6>=6.6",
    "qtawesome>=1.3",
    "reportlab>=4.0",
    "ezdxf>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["slipsurface3d*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = [
    "slipsurface3d/geometry",
    "slipsurface3d/materials",
    "slipsurface3d/loads",
    "slipsurface3d/lem",
    "slipsurface3d/optimizer",
    "slipsurface3d/project.py",
    "slipsurface3d/project_model.py",
    "slipsurface3d/project_import.py",
    "slipsurface3d/project_examples.py",
    "slipsurface3d/analysis.py",
    "slipsurface3d/design.py",
    "slipsurface3d/porewater.py",
    "slipsurface3d/stages.py",
    "slipsurface3d/exchange.py",
    "slipsurface3d/probabilistic.py",
    "slipsurface3d/seismic.py",
    "slipsurface3d/seepage.py",
    "slipsurface3d/cross_section.py",
    "slipsurface3d/scripting.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyvista", "pyvista.*", "PySide6", "PySide6.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
