[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slipsurface3d"
version = "2026.7.1"
description = "Three-dimensional limit-equilibrium slope stability analysis (Method of Columns + PyVista/Qt)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "pyvista>=0.43",
    "PySide6>=6.6",
    "qtawesome>=1.3",
    "reportlab>=4.0",
    "ezdxf>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["slipsurface3d*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = [
    "slipsurface3d/geometry",
    "slipsurface3d/materials",
    "slipsurface3d/loads",
    "slipsurface3d/lem",
    "slipsurface3d/optimizer",
    "slipsurface3d/project.py",
    "slipsurface3d/analysis.py",
    "slipsurface3d/exchange.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyvista", "pyvista.*", "PyQt6", "PyQt6.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
