name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt & VTK headless system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 \
            libxrender1 libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb
      - run: pip install -r requirements-dev.txt
      - run: xvfb-run -a python main.py --check
      - run: xvfb-run -a python main.py --smoke 0.3
      - run: xvfb-run -a python scripts/audit_verification_3d.py
      - run: xvfb-run -a python -m pytest -v -p no:cacheprovider

  test-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_API: pyside6
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Setup headless Mesa3D OpenGL for Windows
        uses: pyvista/setup-headless-display-action@v3
      - run: python main.py --check
      - run: python main.py --smoke 0.3
      - run: python scripts/audit_verification_3d.py
      - run: python -m pytest -v -p no:cacheprovider
